name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  

  part7_bloglist:
    runs-on: ubuntu-24.04
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
    env:
      TEST_MONGODB_URI: mongodb://localhost:27017/bloglist-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bloglist dependencies
        working-directory: open-extension/bloglist/server
        run: npm ci
      - name: Install client dependencies
        working-directory: open-extension/bloglist/client
        run: npm ci
      - name: Run bloglist e2e tests
        working-directory: open-extension/bloglist-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

  part7_routed_anecdotes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install app dependencies
        working-directory: open-extension/routed-anecdotes
        run: npm ci
      - name: Run e2e tests
        working-directory: open-extension/routed-anecdotes-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

  