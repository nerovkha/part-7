name: Periodic health check

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  health_check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check the deployed bloglist
        uses: jtalk/url-health-check-action@v4
        with:
          url: https://nerovkha-bloglist.fly.dev/health
          max-attempts: 3
          retry-delay: 10s
