services:
  mongo:
    image: mongo:8
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    image: bloglist-prod
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - MONGODB_URI=mongodb://mongo:27017/bloglist
      - NODE_ENV=production
      - PORT=3001
    ports:
      - 3001:3001
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
