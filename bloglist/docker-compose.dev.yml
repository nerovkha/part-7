services:
  mongo:
    image: mongo:8
    ports:
      - 27017:27017
    volumes:
      - mongo_dev:/data/db

  server:
    image: bloglist-server-dev
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    volumes:
      - ./server:/app/server
      - /app/server/node_modules
    environment:
      - MONGO_URL=mongodb://mongo:27017/bloglist
      - PORT=3001
    ports:
      - 3001:3001
    depends_on:
      - mongo

  client:
    image: bloglist-client-dev
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    volumes:
      - ./client:/app/client
      - /app/client/node_modules
    ports:
      - 5173:5173
    depends_on:
      - server

volumes:
  mongo_dev:
